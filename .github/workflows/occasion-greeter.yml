name: Birthday & Anniversary Greeter (Bun/TS)

on:
  schedule:
    - cron: '0 17 1-31/2 * *' # 1 AM PHT (UTC+8) = 5 PM UTC, odd-numbered dates only
  workflow_dispatch: # Allow manual trigger

jobs:
  send-greetings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: bun build --compile scripts/index.ts --outfile occasion-greeter

      - name: Run birthday & anniversary greeter
        env:
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CSV_URL: ${{ secrets.CSV_URL }}
          OCCASION_PHOTO_MANIFEST_URL: ${{ secrets.OCCASION_PHOTO_MANIFEST_URL }}
        run: ./occasion-greeter
